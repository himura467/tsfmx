method: bayes

# Selecting on test/mse would tune the hyperparameters on the split the reported numbers come from.
metric:
  name: val/best_loss
  goal: minimize

# Cross-attention reads per-token text embeddings, so the caches must be built with --text-tokens.
# The optimizer space matches fusion_1layer.yml, so the two heads differ only in how they read text.
parameters:
  fusion_type:
    value: cross_attention

  # Every forecast position reads the report in force at the forecast origin, which describes the
  # horizon; fusion_cross_attention.yml has each context patch read its own patch's report instead.
  fusion_position:
    value: forecast

  # Each divides the model dims of both Chronos-2 and TimesFM 2.5.
  num_attention_heads:
    values: [1, 4, 8]

  batch_size:
    values: [2, 4, 8, 16, 32, 64, 128]

  num_epochs:
    values: [5, 10, 15, 20, 25, 30]

  learning_rate:
    distribution: log_uniform_values
    min: 1e-8
    max: 1e-4

  lr_scheduler_type:
    values: ["linear", "cosine"]

  warmup_steps:
    distribution: uniform
    min: 0.0
    max: 0.1

  weight_decay:
    distribution: log_uniform_values
    min: 1e-4
    max: 1e-1

  gradient_accumulation_steps:
    values: [1, 2, 4, 8]

  text_dropout_prob:
    values: [0.0, 0.1, 0.25, 0.5]
